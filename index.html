const P={11:"sensitive,harm,extinct,atmosphere,global warming,fossil fuel,deformed,shrink,depend on,food chain",12:"shrub,fence,temporary,shallow,wetlands,woodlands,convince,propose,force,devour",13:"introduce,spotted,burrow,dozen,disease,develop,drain,dump,damage,disappear",14:"hatchet,fend for one's self,ignite,sputter,painstaking,gratify,self-pity,calf,gingerly,jerk",15:"flammable,kindling,bark,birch tree,match,strike,smolder,accomplish,frustration,wince",16:"cave dweller,examine,staff,doze,gesture,register,stumble,rot,quill,injury",17:"spark,charcoal,glow,flue,fine,fluff,twig,position,limp,nick"};
Object.entries(P).forEach(([k,v])=>v.split(",").forEach(x=>W.push([x,"","",0,[],"",+k]))); // 解釋尚未完成的單字
W.sort((x,y)=>x[6]-y[6]);
const U=[[1,4,"The Path to Paper Son"],[5,8,"Ivy's Journal"],[10,13,"A Place for Frogs"],[14,17,"from Hatchet"]];
let tab=0,mode=0,cur=null,rev=false,sc={ok:0,n:0},fb=null,hint=false;
const app=document.getElementById('app');
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const START=new Date(2026,7,31),T=new Date(),T0=new Date(T.getFullYear(),T.getMonth(),T.getDate());
const cw=Math.floor(Math.round((T0-START)/864e5)/7)+1; // 開學第幾週（<1 代表尚未開學）
const avail=k=>W.some(w=>w[6]===k);
let sel=new Set();const preset=f=>{sel=new Set(Array.from({length:18},(_,i)=>i).filter(k=>avail(k)&&f(k)))};
preset(k=>cw<1||k<=cw); // 自動勾選前週＋當週
const base=()=>W.filter(w=>sel.has(w[6]));
const listAll=()=>tab?base().filter(w=>w[3]):base();
const list=()=>listAll().filter(w=>w[4].length);
function mark(){
 document.getElementById('t0').textContent='ALL（'+base().length+'）';
 document.getElementById('t1').textContent='重點複習（'+base().filter(w=>w[3]).length+'）';
 document.getElementById('t0').classList.toggle('on',!tab);document.getElementById('t1').classList.toggle('on',!!tab);
 [0,1].forEach(i=>document.getElementById('m'+i).classList.toggle('on',mode===i));
 const has=k=>W.filter(w=>w[6]===k).length;
 const ds=`${T0.getFullYear()}/${T0.getMonth()+1}/${T0.getDate()}`;
 document.getElementById('wk').innerHTML=`<div class="bn">📅 今天 ${ds} ・ ${cw<1?'尚未開學（開學日 2026/08/31）':'開學第 <b>'+cw+'</b> 週（開學日 2026/08/31）'}</div>`+
 U.map(([a,b,n])=>`<div class="un"><div class="tag">${n}</div><div class="chips">`+Array.from({length:b-a+1},(_,i)=>a+i).map(k=>`<label class="chip ${sel.has(k)?'on':''} ${has(k)?'':'off'}"><input type="checkbox" data-k="${k}" ${sel.has(k)?'checked':''} ${has(k)?'':'disabled'}>W${k}${k===cw?' ★本週':''}${W.some(w=>w[6]===k&&w[4].length)?'':'・解釋待補'}</label>`).join('')+'</div></div>').join('')+
 `<div class="row" style="margin:8px 0 14px"><button data-p="upto">至本週</button><button data-p="now">只看本週</button><button data-p="all">全選</button><button data-p="none">清除</button></div>`;
 document.querySelectorAll('#wk input').forEach(i=>i.onchange=()=>{const k=+i.dataset.k;i.checked?sel.add(k):sel.delete(k);cur=null;render()});
 document.querySelectorAll('#wk [data-p]').forEach(b=>b.onclick=()=>{const m=b.dataset.p;preset(k=>m==='all'||(m==='upto'&&(cw<1||k<=cw))||(m==='now'&&k===cw));cur=null;render()});
}
function render(){mark();if(!listAll().length){app.innerHTML='<div class="card">請先勾選上方的週別</div>';return}
 if(!list().length){app.innerHTML='<div class="card">這個範圍的單字解釋還在準備中，請改選其他週別。</div>';return}
 mode?quiz():flash()}
function pick(){const L=list();let w;do{w=L[Math.floor(Math.random()*L.length)]}while(L.length>1&&cur&&w===cur.w);cur={w,k:Math.floor(Math.random()*5)};fb=null;hint=false;rev=false}
function ensure(){if(!cur||!list().includes(cur.w))pick()}
function flash(){ensure();const{w,k}=cur;
app.innerHTML=`<div class="card q"><div class="tag">Week ${w[6]} ・ ${w[1]} ・ 解釋 ${k+1} / 5${w[3]?' ・ ★ 重點':''}</div><div class="def">${esc(w[4][k])}</div>
${rev?`<div class="fb ok" style="font-size:1.2rem">${w[0]} <span style="font-weight:400;font-size:.9rem">（${w[2]}）</span></div>${w[5]?`<div class="eg">${esc(w[5])}</div>`:""}`:''}
<div class="row" style="margin-top:12px">${rev?'<button class="pri" id="nx">下一張 →</button>':'<button class="pri" id="sh">顯示答案</button><button id="sw">換一種解釋</button>'}</div></div>`;
if(rev)document.getElementById('nx').onclick=()=>{pick();flash()};else{document.getElementById('sh').onclick=()=>{rev=true;flash()};document.getElementById('sw').onclick=swap}}
function swap(){cur.k=(cur.k+1+Math.floor(Math.random()*4))%5;mode?quiz():flash()}
function quiz(){ensure();const{w,k}=cur;
app.innerHTML=`<div class="score"><span>答對 ${sc.ok} / ${sc.n}</span><span>共 ${list().length} 字</span></div><div class="card q"><div class="tag">Week ${w[6]} ・ ${w[1]} ・ 解釋 ${k+1} / 5${hint?' ・ 首字母 '+w[0][0]+'，共 '+w[0].length+' 個字母':''}</div><div class="def">${esc(w[4][k])}</div>${w[5]?`<div class="tag" style="margin-bottom:10px">${esc(w[5])}</div>`:""}
<input id="a" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="輸入單字…" ${fb?'disabled':''}>
<div class="row">${fb?'<button class="pri" id="nx">下一題 →</button>':'<button class="pri" id="ck">送出</button><button id="sw">換一種解釋</button><button id="hn">提示</button>'}</div>
${fb?`<div class="fb ${fb.ok?'ok':'no'}">${fb.ok?'✅ 答對了！':'❌ 正確答案：'+w[0]} <span style="font-weight:400">（${w[2]}）</span></div>`:''}</div>`;
const a=document.getElementById('a');if(fb){a.value=fb.v}else a.focus();
a.onkeydown=e=>{if(e.key==='Enter')fb?(pick(),quiz()):check()};
if(fb)document.getElementById('nx').onclick=()=>{pick();quiz()};else{document.getElementById('ck').onclick=check;document.getElementById('sw').onclick=swap;document.getElementById('hn').onclick=()=>{hint=true;quiz()}}}
function check(){const v=document.getElementById('a').value.trim();if(!v)return;const ok=v.toLowerCase()===cur.w[0];sc.n++;if(ok)sc.ok++;fb={ok,v};quiz();document.getElementById('nx').focus()}
document.getElementById('t0').onclick=()=>{tab=0;cur=null;render()};
document.getElementById('t1').onclick=()=>{tab=1;cur=null;render()};
document.getElementById('m0').onclick=()=>{mode=0;render()};
document.getElementById('m1').onclick=()=>{mode=1;render()};
document.getElementById('rs').onclick=()=>{sc={ok:0,n:0};cur=null;fb=null;hint=false;rev=false;render()};
render();
</script></body></html>
